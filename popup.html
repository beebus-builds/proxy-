<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hero">
    <span class="dot" id="dot"></span>
    <div class="hero-text">
      <h1 id="headline">Disconnected</h1>
      <p id="subline">Checking status&hellip;</p>
    </div>
  </header>

  <button id="toggle" class="cta" type="button">
    <span id="toggleLabel">Connect</span>
  </button>

  <section class="card">
    <div class="stats">
      <div class="stat">
        <span class="stat-label">Exit IP</span>
        <span class="stat-value" id="exitIp">&mdash;</span>
      </div>
      <div class="stat">
        <span class="stat-label">Latency</span>
        <span class="stat-value" id="latency">&mdash;</span>
      </div>
    </div>
    <button id="check" class="ghost" type="button">Check connection</button>
  </section>

  <div id="banner" class="banner" hidden></div>

  <details id="settings" class="panel">
    <summary>
      <span>Settings</span>
      <span class="saved" id="saved" hidden>Saved</span>
    </summary>
    <div class="panel-body">
      <div class="field">
        <label for="host">Server</label>
        <div class="pair">
          <input type="text" id="host" spellcheck="false" autocomplete="off" placeholder="host" />
          <input type="number" id="port" min="1" max="65535" placeholder="3128" />
        </div>
      </div>

      <div class="field">
        <label for="username">Credentials</label>
        <div class="pair">
          <input type="text" id="username" spellcheck="false" autocomplete="off" placeholder="username" />
          <input type="password" id="password" autocomplete="off" placeholder="password" />
        </div>
      </div>

      <div class="switch-row">
        <div>
          <span class="switch-label">Kill-switch</span>
          <span class="switch-hint">Block all web traffic while disconnected</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="killSwitch" />
          <span class="track"><span class="knob"></span></span>
        </label>
      </div>
    </div>
  </details>

  <footer>
    <span id="engine" class="chip">&mdash;</span>
    <span class="foot-note">Browsers only. Other apps need the bridge.</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
