<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    h1 { font-size: 15px; margin: 0 0 2px; }
    .sub { opacity: .65; font-size: 11px; margin-bottom: 11px; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
    input[type="text"], input[type="number"], input[type="password"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #9996;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      box-sizing: border-box;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 84px; gap: 8px; }
    .half2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .status { padding: 8px 10px; border-radius: 6px; margin: 0 0 12px; font-size: 12px; }
    .on { background: #1a7f3722; border: 1px solid #1a7f3755; }
    .off { background: #88888822; border: 1px solid #88888855; }
    .warn { background: #b5890022; border: 1px solid #b5890055; }
    .kill { background: #b23b3b22; border: 1px solid #b23b3b55; }
    button {
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #9996;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
    }
    button.primary { font-weight: 600; }
    .muted { opacity: .75; font-size: 12px; min-height: 17px; word-break: break-all; }
    .ip { font-family: ui-monospace, Consolas, monospace; }
    .lbl { opacity: .75; font-size: 11px; margin-bottom: 3px; }
    hr { border: none; border-top: 1px solid #9994; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>T35 Proxy</h1>
  <div class="sub">server17.t35.net:3128 &middot; <span id="engine"></span></div>

  <div id="status" class="status off">Off</div>

  <div class="row">
    <label for="enabled"><strong>Connect through proxy</strong></label>
    <input type="checkbox" id="enabled" />
  </div>

  <div class="lbl">Server</div>
  <div class="grid2">
    <input type="text" id="host" placeholder="host" spellcheck="false" />
    <input type="number" id="port" placeholder="3128" min="1" max="65535" />
  </div>

  <div class="half2" style="margin-top:9px">
    <div>
      <div class="lbl">Username</div>
      <input type="text" id="username" placeholder="frontend" spellcheck="false" autocomplete="off" />
    </div>
    <div>
      <div class="lbl">Password</div>
      <input type="password" id="password" placeholder="required" autocomplete="off" />
    </div>
  </div>

  <div class="row" style="margin-top:12px">
    <label for="killSwitch">Kill-switch (block all web traffic while off)</label>
    <input type="checkbox" id="killSwitch" />
  </div>

  <hr />

  <div class="row">
    <button id="save" class="primary" style="flex:1">Save &amp; apply</button>
    <button id="check" style="flex:1">Check IP</button>
  </div>

  <div id="out" class="muted"></div>

  <script src="popup.js"></script>
</body>
</html>
